name: Compilar Instalador de Windows

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: 1. Descargar el código en la máquina virtual
      uses: actions/checkout@v4

    - name: 2. Configurar python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.2'

    - name: 3. Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Versión estable de Node

    - name: 4. Determinar versión a compilar
      id: version
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          VERSION="0.0.0-dev"
        fi
        echo "$VERSION" > backend/version.txt
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: 5. Compilar Frontend (crea la carpeta dist)
      run: |
        cd frontend
        npm install
        npm run build

    - name: 6. Instalar dependencias (librerias)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 7. Compilar con pyinstaller
      run: |
        pyinstaller --noconsole --onedir --icon="backend/icono.ico" --add-data "frontend/dist;frontend/dist" --add-data "backend/templates;backend/templates" --add-data "backend/version.txt;backend" --name "main" backend/main.py

    - name: 8. Compilar instalador con Inno Setup
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} instalador.iss

    - name: 9. Subir el instalador final para descargarlo
      uses: actions/upload-artifact@v4
      with:
        name: Mi-instalador-Windows
        path: output/

    - name: 10. Publicar GitHub Release (solo al pushear un tag vX.Y.Z)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: output/*.exe
        generate_release_notes: true
